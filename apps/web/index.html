<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pushthat.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushThat</title>
    <!--
      What a search result and a shared link show, for the crawlers that read the HTML as
      served and run nothing. The description lives only here: Helmet adds its tags beside
      a static one rather than replacing it, so repeating it in the front page would give
      the page two. The front page's tab title, set through Helmet, is og:title's text. The
      card is apps/web/og/card.html.
    -->
    <meta
      name="description"
      content="Share a link or a file from your phone and it arrives on your computer. Push from the browser and your phone buzzes. End-to-end encrypted with the password you already have. Free to start."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PushThat" />
    <meta property="og:url" content="https://pushthat.link/" />
    <meta property="og:title" content="PushThat: send links and files between your devices, encrypted" />
    <meta
      property="og:description"
      content="Share a link or a file from your phone and it arrives on your computer. Push from the browser and your phone buzzes. End-to-end encrypted with the password you already have. Free to start."
    />
    <meta property="og:image" content="https://pushthat.link/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
