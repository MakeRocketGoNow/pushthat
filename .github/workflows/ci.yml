name: CI

# The checks that need nothing but the repository: the functions' unit tests, the web app's
# lint and build, and the Android app's unit tests. Nothing here deploys.
#
# The emulator suites (`npm run test:emulator` in functions, `npm run test:rules` in
# apps/web) need a Java runtime and the Firebase CLI with the emulators downloaded, and
# stay local for now: AGENTS.md lists them under Verifying, and they are run before a
# deploy. The iOS and macOS apps need Xcode and a macOS runner, and are built locally too.
on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request makes the first one's checks pointless, so don't pay to
# finish them. Pushes to `main` always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: functions/.nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The extension builds without VITE_AXIOM_TOKEN and then logs to the console only,
      # which is what a fork gets. Its bundle is not uploaded from here.
      - run: npm run build:chrome

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 25 because gradle/gradle-daemon-jvm.properties asks for it; the app itself
      # compiles to Java 17.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test
