name: CI

# The checks that need nothing but the repository (the functions' unit tests, the web app's
# lint and builds, the Android unit tests, the encryption reference's tests) run on every
# push to `main`, and on a pull request when it touches what they read (the `affected` job
# below). A push to `main` then deploys whatever it changed
# to the `push-that` Firebase project, once the check for that folder has passed: see
# docs/deploying.md for the jobs, the Google Cloud setup they need, and how to deploy by
# hand.
#
# The emulator suites (`npm run test:emulator` in functions, `npm run test:rules` in
# apps/web) need a Java runtime and the Firebase CLI with the emulators downloaded, so they
# run in the deploy jobs, right before the deploy they guard, rather than on every pull
# request. The iOS and macOS apps need Xcode and a macOS runner, and are built locally.
on:
  push:
    branches: [main]
  pull_request:
  # Run from the Actions tab (on `main`) to redeploy without a commit: after a failed
  # deploy, or after `firebase functions:secrets:set`, since the functions read a secret's
  # version when they are deployed.
  workflow_dispatch:
    inputs:
      deploy:
        description: What to deploy once the checks pass
        type: choice
        options: [both, web, functions]
        default: both

# A second push to a pull request makes the first one's checks pointless, so don't pay to
# finish them. Runs on `main` always finish, and one at a time, so two deploys never
# overlap. GitHub keeps only the newest waiting run, and drops the ones between it and the
# running one; the `changes` job diffs against the last run that succeeded rather than the
# previous commit for exactly that reason.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which checks a pull request needs. A check whose folder the pull request leaves alone is
  # skipped: a copy change on the site has no reason to wait on Gradle. Pushes to `main` and
  # runs started by hand get every check, because the deploys below need theirs to pass.
  #
  # The skipping is done per job with `if:`, not with `paths:` on the trigger, because
  # `functions`, `web` and `android` are required checks on `main`. GitHub counts a skipped
  # job as passing, but a workflow that never started leaves a required check waiting
  # forever and the pull request unmergeable.
  #
  # Each pattern lists everything that check reads, not just its own folder: the web app's
  # key tests and the Android unit tests both read packages/push-test/vectors.json, and the
  # web build reads firebase.json to prerender. A new read outside the folder belongs here
  # too, or a pull request that changes only that file merges without the check that
  # covers it. A change to this file runs everything, so an edit to a job is tested.
  #
  # The jobs below run unless this says `false`, so if it fails they run rather than being
  # skipped unchecked.
  affected:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.diff.outputs.functions }}
      web: ${{ steps.diff.outputs.web }}
      android: ${{ steps.diff.outputs.android }}
      push-test: ${{ steps.diff.outputs.push-test }}
      play-promote: ${{ steps.diff.outputs.play-promote }}
    steps:
      # A pull request's checkout is GitHub's trial merge of it into its base, so the first
      # parent is the base branch and the diff between them is exactly what the merge would
      # change. Two commits deep is enough to have that parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "Changed by this pull request:"
            echo "$changed"
          fi
          # A here-string rather than a pipe: under `pipefail`, `grep -q` stopping early
          # can fail the `echo` feeding it.
          touches() {
            if [ "$EVENT" != pull_request ] || grep -qE "^(\.github/workflows/ci\.yml$|$1)" <<< "$changed"; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "functions=$(touches 'functions/')"
            echo "web=$(touches 'apps/web/|packages/push-test/|\.nvmrc$|firebase\.json$')"
            echo "android=$(touches 'apps/android/|packages/push-test/')"
            echo "push-test=$(touches 'packages/push-test/')"
            echo "play-promote=$(touches '\.github/scripts/|\.nvmrc$')"
          } | tee -a "$GITHUB_OUTPUT"

  functions:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.functions != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: functions/.nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  web:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The encryption keys against the reference's vectors (docs/e2ee.md), what the
      # account key's writes keep, and what the Push page says for each refusal from the
      # rules; plain Node.
      - run: npm run test:keys
      - run: npm run build
      # The extension's bundle is not uploaded from here.
      - run: npm run build:chrome

  android:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 25 because gradle/gradle-daemon-jvm.properties asks for it; the app itself
      # compiles to Java 17.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew test

  # The end-to-end encryption reference (docs/e2ee.md): the round trips, and that
  # vectors.json is what the generator produces, so a change to the bytes cannot land
  # without the vectors the clients check against.
  push-test:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.push-test != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/push-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/push-test/.nvmrc
          cache: npm
          cache-dependency-path: packages/push-test/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: npm test

  # The script android-promote.yml releases to production with. That workflow runs only
  # when someone starts it, so without this a broken change to the script would be found
  # at the moment of a release. No install: the script has no dependencies.
  play-promote:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.play-promote != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test '.github/scripts/*.test.mjs'

  # Which of the two deploys this run makes. A push deploys a folder when it changed since
  # the last push to `main` whose run succeeded: that commit is known to be live, and a run
  # that failed (a check, or a deploy) leaves its changes to be picked up by the next one.
  # `firebase.json` and `.firebaserc` configure both. When there is no such run, or its
  # commit is no longer in the history (a force push), it deploys both rather than guess.
  #
  # The web app and the functions deploy separately, as they do by hand, so that a change
  # to one never redeploys the other: a functions deploy reads the newest version of each
  # secret, and shouldn't do that as a side effect of a copy change.
  changes:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      web: ${{ steps.diff.outputs.web }}
      functions: ${{ steps.diff.outputs.functions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.deploy }}
        run: |
          web=true
          functions=true
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$TARGET" = functions ] && web=false
            [ "$TARGET" = web ] && functions=false
          else
            base=$(gh run list --workflow ci.yml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty')
            if [ -n "$base" ] && changed=$(git diff --name-only "$base" HEAD); then
              echo "Changed since $base:"
              echo "$changed"
              echo "$changed" | grep -qE '^(apps/web/|\.nvmrc$|firebase\.json$|\.firebaserc$)' || web=false
              echo "$changed" | grep -qE '^(functions/|firebase\.json$|\.firebaserc$)' || functions=false
            else
              echo "No commit known to be live; deploying both."
            fi
          fi
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"
          echo "functions=$functions" | tee -a "$GITHUB_OUTPUT"

  # The functions go first: a change that adds a function and the web code that calls it
  # must not ship the caller before the callee.
  deploy-functions:
    needs: [changes, functions]
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: functions/.nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # The emulators need Java 21 or later.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Pinned, and bumped by hand: Dependabot doesn't see a global install, and an old CLI
      # fails to parse what a newer firebase-functions declares.
      - run: npm install -g firebase-tools@15.34.1
      - run: npm ci
      - run: npm run test:emulator
      # Credentials come last, so nothing before the deploy runs with them. There is no key:
      # GitHub's OIDC token for this run is exchanged for the deploy service account, and
      # only a run on `main` of this repository can make that exchange.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # Non-interactive, a deploy that would delete a function stops instead: removing one
      # is done by hand (docs/deploying.md).
      - run: npm run deploy -- --non-interactive

  # `npm run deploy` runs the rules tests before it builds and deploys, as it does by hand.
  deploy-web:
    needs: [changes, web, deploy-functions]
    # Waits for the functions, and goes ahead when they were skipped but not when they
    # failed. `!cancelled()` is what lets it run after a skipped job at all.
    if: >-
      !cancelled() && needs.changes.outputs.web == 'true' && needs.web.result == 'success'
      && (needs.deploy-functions.result == 'success' || needs.deploy-functions.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools@15.34.1
      - run: npm ci
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: npm run deploy -- --non-interactive
