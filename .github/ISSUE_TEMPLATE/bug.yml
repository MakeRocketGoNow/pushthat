name: Bug report
description: Something in PushThat does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Issues here are public.** Please don't paste what you pushed: no links, file names or screenshots that show them. Describe the shape instead, like "a link with a very long query string" or "a PDF over 20 MB".

        Found a security problem? Please report it privately instead, as [SECURITY.md](https://github.com/MakeRocketGoNow/pushthat/blob/main/SECURITY.md) says.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      description: The steps, if you know them. "It happens sometimes" helps too.
      placeholder: |
        1. Share a link from the Android app
        2. ...
  - type: dropdown
    id: where
    attributes:
      label: Where were you using PushThat?
      multiple: true
      options:
        - The web app
        - The Chrome extension
        - The Android app
        - The iOS app
        - The macOS app
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome on a Mac, a Pixel 9, an iPhone 16 ...
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's or the extension's version, if you know it.
